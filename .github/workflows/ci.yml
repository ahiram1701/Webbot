# Una sola puerta de calidad para todo: `npm run verify` (tipos, tests, build de la extension y la
# comprobacion del bundle inyectado). Lo que se publica sale siempre de un commit que la ha pasado.
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# En un PR solo importa el ultimo push; en master y en los tags cada run publica algo, asi que
# ninguno se cancela a medias.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # GHCR exige minusculas y el repo se llama "Webbot".
  IMAGE: ghcr.io/ahiram1701/webbot

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 es el minimo de `engines`; 24 es la del Dockerfile.
        node: [20, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify

  docker:
    name: imagen del servidor
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      # En un PR solo se comprueba que el Dockerfile construye: nada se publica sin fusionar.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: release de la extension
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # El manifest toma su version de este package.json: un tag que no cuadre publicaria un zip
      # que dice ser otra version.
      - name: El tag coincide con la version de la extension
        run: |
          expected="v$(node -p "require('./packages/extension/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::El tag es $GITHUB_REF_NAME pero packages/extension/package.json dice $expected"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Empaquetar la extension
        run: |
          cp LICENSE packages/extension/dist/
          cd packages/extension/dist
          zip -r "$GITHUB_WORKSPACE/webbot-extension-$GITHUB_REF_NAME.zip" .
      - name: Crear la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "webbot-extension-$GITHUB_REF_NAME.zip" --generate-notes --verify-tag
