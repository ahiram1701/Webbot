<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Webbot</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #18181b;
        --muted: #71717a;
        --bg: #ffffff;
        --border: #e4e4e7;
        --ok: #16a34a;
        --bad: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f4f4f5;
          --muted: #a1a1aa;
          --bg: #18181b;
          --border: #3f3f46;
        }
      }
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--bad);
        flex: none;
      }
      .dot.on {
        background: var(--ok);
      }
      #detail {
        color: var(--muted);
        margin: 0 0 12px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 3px 0;
        border-top: 1px solid var(--border);
      }
      .row span:last-child {
        color: var(--muted);
        text-align: right;
      }
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 14px 0 6px;
      }
      ol {
        margin: 0;
        padding: 0;
        list-style: none;
        max-height: 160px;
        overflow-y: auto;
      }
      li {
        display: flex;
        gap: 6px;
        padding: 3px 0;
        border-top: 1px solid var(--border);
      }
      li .mark {
        flex: none;
      }
      li .cmd {
        flex: 1;
        font-family: ui-monospace, "Cascadia Code", monospace;
        font-size: 11px;
        overflow-wrap: anywhere;
      }
      li .time {
        color: var(--muted);
        flex: none;
        font-size: 11px;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      button {
        flex: 1;
        padding: 6px 8px;
        font: inherit;
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--muted);
      }
      .empty {
        color: var(--muted);
        padding: 6px 0;
      }
    </style>
  </head>
  <body>
    <h1><span class="dot" id="dot"></span><span id="state">Comprobando...</span></h1>
    <p id="detail"></p>

    <div class="row"><span>Puente</span><span id="port">-</span></div>
    <div class="row"><span>Token</span><span id="token">-</span></div>
    <div class="row"><span>Dominios permitidos</span><span id="allow">-</span></div>

    <h2>Ultimas acciones</h2>
    <ol id="log">
      <li class="empty">Sin actividad todavia.</li>
    </ol>

    <div class="actions">
      <button id="reconnect">Reconectar</button>
      <button id="options">Opciones</button>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
